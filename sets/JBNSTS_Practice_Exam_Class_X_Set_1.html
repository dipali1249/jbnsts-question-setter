<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JBNSTS Practice Exam — Class X (Set 1) — English + Bengali</title>
<style>
:root{ --ink:#17171a; --muted:#8a8a93; --line:#e8e7e2; --accent:#3b3bf0; --bg:#faf9f6; --good:#1a7f37; --bad:#cf222e; }
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:"Noto Sans Bengali","Nirmala UI","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55; padding:0 20px;}
.screen{max-width:700px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
.hidden{display:none !important;}
button{font-family:inherit; cursor:pointer;}
#start-screen{justify-content:center; text-align:center;}
.kicker{color:var(--muted); font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; margin-bottom:14px;}
#start-screen h1{font-size:1.75rem; letter-spacing:-.02em; margin-bottom:8px;}
#start-screen h1.en{font-size:1.15rem; color:var(--muted); font-weight:600;}
.meta{color:var(--muted); font-size:.95rem; margin-bottom:10px;}
.bigbtn{background:var(--ink); color:#fff; border:none; font-size:1rem; font-weight:600;
  padding:15px 46px; border-radius:999px; margin-top:22px;}
.bigbtn:hover{transform:translateY(-2px); opacity:.92;}
.bar{height:3px; background:var(--line); border-radius:2px; margin:26px 0 6px; overflow:hidden;}
.bar i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease;}
.toprow{display:flex; justify-content:space-between; align-items:baseline; padding:6px 0 24px; gap:10px;}
.count{color:var(--muted); font-size:.85rem; font-weight:600; letter-spacing:.06em;}
.timer{font-variant-numeric:tabular-nums; font-weight:700; font-size:1.05rem; color:var(--muted);}
.timer.warn{color:#b45309;} .timer.danger{color:var(--bad); animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.45;}}
.jumpbtn{background:none; border:none; color:var(--muted); font-size:.78rem; font-weight:700; letter-spacing:.06em; padding:4px 0;}
.jumpbtn:hover{color:var(--ink); text-decoration:underline;}
.qwrap{flex:1; animation:slide .28s ease;}
@keyframes slide{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.qtext .bn{font-size:1.3rem; font-weight:700; letter-spacing:-.01em;}
.qtext .en{font-size:.98rem; color:var(--muted); font-weight:500; margin-top:5px;}
.qsub{color:var(--muted); font-size:.83rem; margin:12px 0 22px;}
.opts{display:flex; flex-direction:column;}
.opt{display:flex; gap:14px; align-items:flex-start; text-align:left; width:100%; border:none;
  background:none; padding:13px 10px; font-size:1.05rem; border-bottom:1px solid var(--line); color:var(--ink);}
.opt:first-child{border-top:1px solid var(--line);}
.opt:hover{background:#f1f0ea;}
.opt.sel{background:#eef0ff;}
.opt .key{flex:0 0 22px; font-size:.75rem; font-weight:700; color:var(--muted); padding-top:4px;}
.opt.sel .key{color:var(--accent);}
.opt .bn{display:block; font-weight:600;}
.opt .en{display:block; font-size:.85rem; color:var(--muted);}
.navrow{display:flex; justify-content:space-between; padding:22px 0 40px;}
.linkbtn{background:none; border:none; color:var(--muted); font-size:.9rem; font-weight:600;}
.linkbtn:hover{color:var(--ink); text-decoration:underline;}
.nextbtn{background:var(--ink); color:#fff; border:none; padding:12px 26px; border-radius:999px; font-weight:600;}
.nextbtn:hover{opacity:.9;}
#overview-screen,#result-screen{padding-top:40px;}
#overview-screen h2,#result-screen h2{font-size:1.5rem; margin-bottom:8px;}
.ov-sub{color:var(--muted); margin-bottom:24px; font-size:.95rem;}
.grid{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:30px;}
.gcell{aspect-ratio:1; border:1px solid var(--line); background:#fff; border-radius:10px; font-weight:700; font-size:.95rem;}
.gcell.done{background:var(--ink); color:#fff; border-color:var(--ink);}
.gcell.cur{outline:2px solid var(--accent);}
.ov-actions{display:flex; gap:16px; align-items:center;}
.pct{font-size:4rem; font-weight:800; letter-spacing:-.03em; margin:10px 0;}
.pct small{font-size:1.5rem; color:var(--muted);}
.verdict{font-size:1.1rem; font-weight:700; margin-bottom:6px;}
.verdict.pass{color:var(--good);} .verdict.fail{color:var(--bad);}
.rnote{color:var(--muted); font-size:.9rem; margin-bottom:28px;}
.review{display:flex; flex-direction:column; gap:16px; margin-bottom:30px;}
.rev{border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:#fff;}
.rev .q{font-weight:600; margin-bottom:8px; display:flex; justify-content:space-between; gap:12px;}
.rev .q .en{display:block; font-weight:500; color:var(--muted); font-size:.88rem; margin-top:3px;}
.tag{font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:999px; white-space:nowrap; height:fit-content;}
.tag.ok{background:#e6f4ea; color:var(--good);} .tag.no{background:#fbe9ea; color:var(--bad);}
.line{font-size:.9rem; color:#444; margin-bottom:3px;}
.ans-ok{color:var(--good); font-weight:600;} .ans-no{color:var(--bad); font-weight:600;}
.exp{font-size:.9rem; color:#555; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
.exp .en{color:var(--muted); font-size:.85rem;}
.src{font-size:.75rem; color:var(--muted); margin-top:6px;}
.weak{border:1px solid var(--line); border-radius:12px; padding:16px; background:#fff; margin-bottom:30px;}
.weak h3{font-size:1rem; margin-bottom:10px;}
.weak ul{list-style:none; display:flex; flex-wrap:wrap; gap:8px;}
.weak li{background:#fbe9ea; color:var(--bad); font-size:.82rem; font-weight:600; padding:5px 12px; border-radius:999px;}
.weak p{font-size:.9rem; color:#555;}
.again{background:none; border:1px solid var(--line); padding:12px 26px; border-radius:999px; font-weight:600; margin-bottom:50px;}
.again:hover{background:#f1f0ea;}
</style>
</head>
<body>
<div id="start-screen" class="screen">
  <div>
    <div class="kicker">Examination / পরীক্ষা</div>
    <h1 id="s-title-bn"></h1>
    <h1 id="s-title" class="en"></h1>
    <div class="meta" id="s-meta"></div>
    <button class="bigbtn" onclick="startExam()">Begin &rarr;</button>
  </div>
</div>
<div id="exam-screen" class="screen hidden">
  <div class="bar"><i id="prog"></i></div>
  <div class="toprow">
    <span class="count" id="q-count"></span>
    <button class="jumpbtn" onclick="showOverview('Jump to any question')">All questions</button>
    <span class="timer" id="timer">--:--</span>
  </div>
  <div class="qwrap">
    <div class="qtext" id="q-text"></div>
    <div class="qsub" id="q-sub"></div>
    <div class="opts" id="opts"></div>
  </div>
  <div class="navrow">
    <button class="linkbtn" id="prev" onclick="go(-1)">&larr; Previous</button>
    <button class="nextbtn" id="next" onclick="nextOrFinish()">Next &rarr;</button>
  </div>
</div>
<div id="overview-screen" class="screen hidden">
  <h2 id="ov-title">Almost done</h2>
  <div class="ov-sub" id="ov-sub"></div>
  <div class="grid" id="grid"></div>
  <div class="ov-actions">
    <button class="bigbtn" onclick="finish(false)">Submit exam</button>
    <button class="linkbtn" onclick="backToExam()">&larr; Back to questions</button>
  </div>
</div>
<div id="result-screen" class="screen hidden">
  <div>
    <div class="kicker" id="r-kicker">Result</div>
    <div class="pct"><span id="r-pct">0</span><small>%</small></div>
    <div class="verdict" id="verdict"></div>
    <div class="rnote" id="r-note"></div>
    <div class="weak" id="weak"></div>
    <div class="review" id="review"></div>
    <button class="again" onclick="location.reload()">Retake exam</button>
  </div>
</div>
<script>
const EXAM = {"title": "JBNSTS Junior Talent Search - Practice Exam (Class 10, Set 1)", "subtitle": "Class 10 syllabus | all Indian boards | Physical Science - Life Science - Mathematics", "durationMinutes": 180, "passPercent": 40, "negativeMark": 0.5, "autoAdvance": true, "questions": [{"subject": "Mathematics", "topic": "Real Numbers", "board": "CBSE", "q": "The decimal expansion of 13/125 is:", "options": ["Terminating", "Non-terminating recurring", "Non-terminating non-recurring", "Cannot be determined"], "answer": 0, "explain": "125 = 5^3, so the denominator is of the form 2^a 5^b; hence the decimal terminates.", "marks": 2, "bn_q": "13/125 এর দশমিক বিস্তার হলো:", "bn_options": ["সমাপ্ত", "অ-সমাপ্ত পুনরাবৃত্ত", "অ-সমাপ্ত অ-পুনরাবৃত্ত", "নির্ধারণ করা যায় না"], "bn_explain": "125 = 5^3, তাই হরটি 2^a 5^b আকারের; সুতরাং দশমিকটি সমাপ্ত হয়।", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Real Numbers", "board": "ICSE", "q": "The LCM of 12 and 18 is:", "options": ["6", "36", "72", "216"], "answer": 1, "explain": "12 = 2^2 x 3, 18 = 2 x 3^2; LCM = 2^2 x 3^2 = 36.", "marks": 2, "bn_q": "12 এবং 18 এর লঘিষ্ঠ সাধারণ গুণিতক হলো:", "bn_options": ["6", "36", "72", "216"], "bn_explain": "12 = 2^2 x 3, 18 = 2 x 3^2; লঘিষ্ঠ সাধারণ গুণিতক = 2^2 x 3^2 = 36.", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Polynomials", "board": "WBBSE", "q": "If alpha and beta are the zeroes of x^2 - 5x + 6, then alpha + beta equals:", "options": ["-5", "5", "6", "-6"], "answer": 1, "explain": "For ax^2+bx+c, sum of zeroes = -b/a = 5.", "marks": 2, "bn_q": "যদি আলফা এবং বিটা x^2 - 5x + 6 এর শূন্য হয়, তবে আলফা + বিটা সমান:", "bn_options": ["-5", "5", "6", "-6"], "bn_explain": "ax^2+bx+c এর জন্য, শূন্যগুলোর যোগফল = -b/a = 5.", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Quadratic Equations", "board": "Maharashtra", "q": "The discriminant of 2x^2 - 4x + 3 = 0 is:", "options": ["8", "-8", "40", "-40"], "answer": 1, "explain": "D = b^2 - 4ac = 16 - 24 = -8, so the equation has no real roots.", "marks": 2, "bn_q": "2x^2 - 4x + 3 = 0 এর ভেদাঙ্ক হলো:", "bn_options": ["8", "-8", "40", "-40"], "bn_explain": "D = b^2 - 4ac = 16 - 24 = -8, তাই সমীকরণটির কোনো বাস্তব মূল নেই।", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Arithmetic Progressions", "board": "Karnataka", "q": "The 7th term of the AP 3, 7, 11, ... is:", "options": ["23", "27", "31", "19"], "answer": 1, "explain": "a = 3, d = 4; a7 = a + 6d = 3 + 24 = 27.", "marks": 2, "bn_q": "3, 7, 11, ... AP এর 7ম পদ হলো:", "bn_options": ["23", "27", "31", "19"], "bn_explain": "a = 3, d = 4; a7 = a + 6d = 3 + 24 = 27.", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Coordinate Geometry", "board": "CBSE", "q": "The distance between the points (0, 0) and (3, 4) is:", "options": ["5", "7", "sqrt(7)", "25"], "answer": 0, "explain": "Distance = sqrt(3^2 + 4^2) = sqrt(25) = 5.", "marks": 2, "bn_q": "(0, 0) এবং (3, 4) বিন্দু দুটির মধ্যবর্তী দূরত্ব হলো:", "bn_options": ["5", "7", "sqrt(7)", "25"], "bn_explain": "দূরত্ব = sqrt(3^2 + 4^2) = sqrt(25) = 5.", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Trigonometry", "board": "Tamil Nadu", "q": "The value of sin30 + cos60 is:", "options": ["0", "1/2", "1", "sqrt(3)/2"], "answer": 2, "explain": "sin30 = 1/2 and cos60 = 1/2, so the sum is 1.", "marks": 2, "bn_q": "sin30 + cos60 এর মান হলো:", "bn_options": ["0", "1/2", "1", "sqrt(3)/2"], "bn_explain": "sin30 = 1/2 এবং cos60 = 1/2, তাই যোগফল হলো 1.", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Trigonometry", "board": "UP", "q": "If tan(theta) = 3/4, then sin(theta) equals:", "options": ["3/5", "4/5", "5/3", "4/3"], "answer": 0, "explain": "Opposite 3, adjacent 4, hypotenuse 5; sin = 3/5.", "marks": 2, "bn_q": "যদি tan(theta) = 3/4 হয়, তবে sin(theta) সমান:", "bn_options": ["3/5", "4/5", "5/3", "4/3"], "bn_explain": "বিপরীত বাহু 3, সন্নিহিত বাহু 4, অতিভুজ 5; sin = 3/5.", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Circles", "board": "ICSE", "q": "The length of the tangent from a point 13 cm from the centre of a circle of radius 5 cm is:", "options": ["8 cm", "12 cm", "18 cm", "sqrt(194) cm"], "answer": 1, "explain": "Tangent = sqrt(13^2 - 5^2) = sqrt(144) = 12 cm.", "marks": 2, "bn_q": "5 cm ব্যাসার্ধের একটি বৃত্তের কেন্দ্র থেকে 13 cm দূরে অবস্থিত একটি বিন্দু থেকে অঙ্কিত স্পর্শকের দৈর্ঘ্য হলো:", "bn_options": ["8 cm", "12 cm", "18 cm", "sqrt(194) cm"], "bn_explain": "স্পর্শক = sqrt(13^2 - 5^2) = sqrt(144) = 12 cm.", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Circles", "board": "WBBSE", "q": "The angle subtended by a diameter at any point on the circle is:", "options": ["45 degrees", "60 degrees", "90 degrees", "180 degrees"], "answer": 2, "explain": "The angle in a semicircle is a right angle (90 degrees).", "marks": 2, "bn_q": "বৃত্তের যেকোনো বিন্দুতে একটি ব্যাস দ্বারা উৎপন্ন কোণ হলো:", "bn_options": ["45 ডিগ্রি", "60 ডিগ্রি", "90 ডিগ্রি", "180 ডিগ্রি"], "bn_explain": "একটি অর্ধবৃত্তের কোণ হলো সমকোণ (90 ডিগ্রি)।", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Surface Areas and Volumes", "board": "CBSE", "q": "The volume of a sphere of radius 3 cm is:", "options": ["9pi cm^3", "27pi cm^3", "36pi cm^3", "12pi cm^3"], "answer": 2, "explain": "V = (4/3)pi r^3 = (4/3)pi x 27 = 36pi cm^3.", "marks": 2, "bn_q": "3 cm ব্যাসার্ধের একটি গোলকের আয়তন হলো:", "bn_options": ["9pi cm^3", "27pi cm^3", "36pi cm^3", "12pi cm^3"], "bn_explain": "V = (4/3)pi r^3 = (4/3)pi x 27 = 36pi cm^3.", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Triangles", "board": "Maharashtra", "q": "If two triangles are similar and their corresponding sides are in the ratio 2:3, the ratio of their areas is:", "options": ["2:3", "4:9", "3:2", "8:27"], "answer": 1, "explain": "Ratio of areas = square of the ratio of sides = (2/3)^2 = 4:9.", "marks": 2, "bn_q": "যদি দুটি ত্রিভুজ সদৃশ হয় এবং তাদের অনুরূপ বাহুগুলোর অনুপাত 2:3 হয়, তবে তাদের ক্ষেত্রফলের অনুপাত হলো:", "bn_options": ["2:3", "4:9", "3:2", "8:27"], "bn_explain": "ক্ষেত্রফলের অনুপাত = বাহুর অনুপাতের বর্গ = (2/3)^2 = 4:9.", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Pair of Linear Equations", "board": "Karnataka", "q": "The solution of x + y = 5 and x - y = 1 is:", "options": ["x = 3, y = 2", "x = 2, y = 3", "x = 4, y = 1", "x = 1, y = 4"], "answer": 0, "explain": "Adding: 2x = 6 so x = 3; then y = 2.", "marks": 2, "bn_q": "x + y = 5 এবং x - y = 1 এর সমাধান হলো:", "bn_options": ["x = 3, y = 2", "x = 2, y = 3", "x = 4, y = 1", "x = 1, y = 4"], "bn_explain": "যোগ করলে: 2x = 6 তাই x = 3; তারপর y = 2.", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Statistics", "board": "UP", "q": "The mean of the first five natural numbers is:", "options": ["2", "2.5", "3", "4"], "answer": 2, "explain": "(1+2+3+4+5)/5 = 15/5 = 3.", "marks": 2, "bn_q": "প্রথম পাঁচটি স্বাভাবিক সংখ্যার গড় হলো:", "bn_options": ["2", "2.5", "3", "4"], "bn_explain": "(1+2+3+4+5)/5 = 15/5 = 3.", "subject_bn": "গণিত"}, {"subject": "Mathematics", "topic": "Probability", "board": "CBSE", "q": "A fair coin is tossed once. The probability of getting a head is:", "options": ["0", "1/4", "1/2", "1"], "answer": 2, "explain": "One favourable outcome out of two equally likely outcomes = 1/2.", "marks": 2, "bn_q": "একটি নিরপেক্ষ কয়েন একবার টস করা হলো। হেড পাওয়ার সম্ভাবনা হলো:", "bn_options": ["0", "1/4", "1/2", "1"], "bn_explain": "দুটি সমান সম্ভাব্য ফলাফলের মধ্যে একটি অনুকূল ফলাফল = 1/2.", "subject_bn": "গণিত"}, {"subject": "Physical Science", "topic": "Chemical Reactions", "board": "CBSE", "q": "In the reaction 2H2 + O2 -> 2H2O, the ratio of hydrogen to oxygen molecules reacting is:", "options": ["1:1", "2:1", "1:2", "2:3"], "answer": 1, "explain": "Two molecules of H2 combine with one molecule of O2, so the ratio is 2:1.", "marks": 2, "bn_q": "2H2 + O2 -> 2H2O বিক্রিয়ায়, বিক্রিয়াশীল হাইড্রোজেন ও অক্সিজেনের অণুর অনুপাত হলো:", "bn_options": ["1:1", "2:1", "1:2", "2:3"], "bn_explain": "H2 এর দুটি অণু }
function tick(){
  const t=$("timer"); t.textContent = fmt(timeLeft);
  t.className = "timer" + (timeLeft<=60?" danger": timeLeft<=300?" warn":"");
  if(timeLeft<=0){ finish(true); return; } timeLeft--;
}
const fmt = s => String(Math.floor(Math.max(0,s)/60)).padStart(2,"0")+":"+String(Math.max(0,s)%60).padStart(2,"0");
function render(){
  const q=EXAM.questions[cur];
  $("q-count").textContent = `Question ${cur+1} / ${n}`;
  $("prog").style.width = ((cur+1)/n*100)+"%";
  $("q-text").innerHTML = `<div class="bn">${q.bn_q}</div><div class="en">${q.q}</div>`;
  $("q-sub").textContent = `${q.subject_bn} · ${q.subject} · ${q.topic} · ${q.board}`;
  $("opts").innerHTML = q.options.map((o,i)=>
    `<button class="opt ${answers[cur]===i?'sel':''}" onclick="choose(${i})">
       <span class="key">${"ABCD"[i]}</span>
       <span><span class="bn">${q.bn_options[i]}</span><span class="en">${o}</span></span></button>`).join("");
  $("prev").style.visibility = cur===0 ? "hidden":"visible";
  $("next").textContent = cur===n-1 ? "Finish" : "Next";
}
function choose(i){ answers[cur]=i; render(); if(EXAM.autoAdvance && cur<n-1){ setTimeout(()=>go(1),180); } }
function go(d){ cur=Math.min(n-1,Math.max(0,cur+d)); render(); window.scrollTo(0,0); }
function nextOrFinish(){ if(cur===n-1) showOverview("Almost done"); else go(1); }
function showOverview(heading){
  $("exam-screen").classList.add("hidden"); $("overview-screen").classList.remove("hidden");
  $("ov-title").textContent = heading;
  const left = answers.filter(a=>a===null).length;
  $("ov-sub").textContent = left ? `${left} question(s) still unanswered.` : "All questions answered. Submit when ready.";
  $("grid").innerHTML = EXAM.questions.map((_,i)=>
    `<button class="gcell ${answers[i]!==null?'done':''} ${i===cur?'cur':''}" onclick="jumpFromOverview(${i})">${i+1}</button>`).join("");
  window.scrollTo(0,0);
}
function backToExam(){ $("overview-screen").classList.add("hidden"); $("exam-screen").classList.remove("hidden"); }
function jumpFromOverview(i){ cur=i; backToExam(); render(); }
function finish(auto){
  clearInterval(timerId);
  let score=0; const results=[], weak=[];
  EXAM.questions.forEach((q,i)=>{
    const ok = answers[i]===q.answer; results.push(ok);
    if(ok) score += (q.marks||1); else if(answers[i]!==null) score -= (EXAM.negativeMark||0);
    if(!ok && answers[i]!==null) weak.push(`${q.subject_bn}: ${q.topic}`);
    else if(answers[i]===null) weak.push(`${q.subject_bn}: ${q.topic} (not attempted)`);
  });
  const pct = Math.max(0, Math.round(score/totalMarks*100));
  const passed = pct >= EXAM.passPercent;
  $("r-kicker").textContent = auto ? "Time's up - auto-submitted" : "Result";
  $("r-pct").textContent = pct;
  const v=$("verdict"); v.textContent = passed ? "Passed" : "Not passed this time"; v.className = "verdict " + (passed?"pass":"fail");
  const used = Math.min(Math.round((Date.now()-startedAt)/1000), EXAM.durationMinutes*60);
  $("r-note").textContent = `${score} of ${totalMarks} marks (negative marking applied) · pass mark ${EXAM.passPercent}% · time used ${fmt(used)}`;
  const uniq=[...new Set(weak)];
  $("weak").innerHTML = uniq.length
    ? `<h3>Weaker portions to revise / দুর্বল অংশ</h3><ul>${uniq.map(w=>`<li>${w}</li>`).join("")}</ul>`
    : `<h3>Weaker portions to revise / দুর্বল অংশ</h3><p>None - you got every attempted question right. Excellent.</p>`;
  $("review").innerHTML = EXAM.questions.map((q,i)=>`
    <div class="rev">
      <div class="q"><span><span>Q${i+1}. ${q.bn_q}</span><span class="en">${q.q}</span></span><span class="tag ${results[i]?'ok':'no'}">${results[i]?'correct':'wrong'}</span></div>
      <div class="line">Your answer: <span class="${results[i]?'ans-ok':'ans-no'}">${answers[i]!=null?q.bn_options[answers[i]]+" ("+q.options[answers[i]]+")":"- not answered -"}</span></div>
      ${results[i]?"":`<div class="line">Correct answer: <span class="ans-ok">${q.bn_options[q.answer]} (${q.options[q.answer]})</span></div>`}
      ${q.explain?`<div class="exp"><div>${q.bn_explain}</div><div class="en">${q.explain}</div></div>`:""}
      <div class="src">${q.subject_bn} · ${q.subject} · ${q.topic} · ${q.board}</div>
    </div>`).join("");
  $("exam-screen").classList.add("hidden"); $("overview-screen").classList.add("hidden");
  $("result-screen").classList.remove("hidden"); window.scrollTo(0,0);
}
init();

</script>
